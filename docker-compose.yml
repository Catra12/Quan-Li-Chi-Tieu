services:
  app:
    build: .
    image: expense-tracker-app:latest
    container_name: expense-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: ${PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/quanlychitieu}
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - expense-network

  mongo:
    image: mongo:7.0
    container_name: expense-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - expense-network

volumes:
  mongo_data:

networks:
  expense-network:
    driver: bridge
